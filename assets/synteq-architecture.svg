<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Synteq architecture diagram</title>
  <desc id="desc">A sanitized Google Cloud architecture diagram for Synteq.</desc>
  <rect width="1400" height="900" fill="#f7f8fb"/>
  <text x="70" y="80" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700" fill="#172033">Synteq Architecture</text>
  <text x="70" y="118" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5d6678">Sanitized public showcase view</text>

  <rect x="70" y="170" width="250" height="120" rx="14" fill="#ffffff" stroke="#cfd6e6"/>
  <text x="95" y="215" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">Workflow Sources</text>
  <text x="95" y="250" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5d6678">n8n, GitHub Actions, CRM, webhooks</text>

  <rect x="410" y="170" width="250" height="120" rx="14" fill="#ffffff" stroke="#cfd6e6"/>
  <text x="435" y="215" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">Cloud Run API</text>
  <text x="435" y="250" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5d6678">Auth, ingest, control plane</text>

  <rect x="750" y="170" width="250" height="120" rx="14" fill="#ffffff" stroke="#cfd6e6"/>
  <text x="775" y="215" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">Pub/Sub</text>
  <text x="775" y="250" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5d6678">Buffered operational events</text>

  <rect x="1080" y="170" width="250" height="120" rx="14" fill="#ffffff" stroke="#cfd6e6"/>
  <text x="1105" y="215" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">Workers</text>
  <text x="1105" y="250" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5d6678">Normalize, group, aggregate</text>

  <rect x="410" y="420" width="250" height="120" rx="14" fill="#ffffff" stroke="#cfd6e6"/>
  <text x="435" y="465" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">Cloud SQL</text>
  <text x="435" y="500" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5d6678">Tenants, incidents, settings</text>

  <rect x="750" y="420" width="250" height="120" rx="14" fill="#ffffff" stroke="#cfd6e6"/>
  <text x="775" y="465" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">BigQuery</text>
  <text x="775" y="500" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5d6678">Telemetry and reliability windows</text>

  <rect x="1080" y="420" width="250" height="120" rx="14" fill="#ffffff" stroke="#cfd6e6"/>
  <text x="1105" y="465" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">Vertex AI Gemini</text>
  <text x="1105" y="500" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5d6678">Redacted operational insight</text>

  <rect x="70" y="650" width="250" height="120" rx="14" fill="#ffffff" stroke="#cfd6e6"/>
  <text x="95" y="695" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">Cloud Scheduler</text>
  <text x="95" y="730" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5d6678">Aggregate and alert jobs</text>

  <rect x="410" y="650" width="250" height="120" rx="14" fill="#ffffff" stroke="#cfd6e6"/>
  <text x="435" y="695" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">Cloud Run Web</text>
  <text x="435" y="730" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5d6678">Dashboard and operations UI</text>

  <rect x="750" y="650" width="250" height="120" rx="14" fill="#ffffff" stroke="#cfd6e6"/>
  <text x="775" y="695" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">Secret Manager</text>
  <text x="775" y="730" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5d6678">Runtime secret references</text>

  <path d="M320 230 H410" stroke="#4c7df0" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M660 230 H750" stroke="#4c7df0" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1000 230 H1080" stroke="#4c7df0" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1205 290 V420" stroke="#4c7df0" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1080 480 H1000" stroke="#4c7df0" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M875 420 V290" stroke="#4c7df0" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M1080 515 C940 600 790 660 660 700" stroke="#4c7df0" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M320 710 H410" stroke="#4c7df0" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M535 650 V540" stroke="#4c7df0" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <path d="M875 650 V540" stroke="#4c7df0" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c7df0"/>
    </marker>
  </defs>
</svg>
