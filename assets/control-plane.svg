<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Synteq control plane mockup</title>
  <desc id="desc">A sanitized product screenshot mockup showing source and integration setup.</desc>
  <rect width="1440" height="900" fill="#eef2f7"/>
  <rect x="50" y="50" width="1340" height="800" rx="18" fill="#ffffff" stroke="#d8deea"/>
  <text x="92" y="124" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#172033">Control Plane</text>
  <text x="92" y="162" font-family="Inter, Arial, sans-serif" font-size="18" fill="#68738a">Safe setup view with synthetic integration records</text>

  <rect x="92" y="220" width="380" height="530" rx="12" fill="#f8fafc" stroke="#d8deea"/>
  <text x="122" y="270" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Sources</text>
  <rect x="122" y="315" width="315" height="70" rx="8" fill="#ffffff" stroke="#d8deea"/>
  <text x="145" y="357" font-family="Inter, Arial, sans-serif" font-size="17" fill="#172033">n8n onboarding</text>
  <rect x="122" y="410" width="315" height="70" rx="8" fill="#ffffff" stroke="#d8deea"/>
  <text x="145" y="452" font-family="Inter, Arial, sans-serif" font-size="17" fill="#172033">GitHub workflow monitor</text>
  <rect x="122" y="505" width="315" height="70" rx="8" fill="#ffffff" stroke="#d8deea"/>
  <text x="145" y="547" font-family="Inter, Arial, sans-serif" font-size="17" fill="#172033">Generic webhook source</text>

  <rect x="535" y="220" width="755" height="245" rx="12" fill="#f8fafc" stroke="#d8deea"/>
  <text x="565" y="270" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Ingestion keys</text>
  <text x="565" y="322" font-family="Inter, Arial, sans-serif" font-size="17" fill="#475569">Keys are displayed once, hashed at rest, and never stored in public examples.</text>
  <rect x="565" y="355" width="680" height="58" rx="8" fill="#ffffff" stroke="#d8deea"/>
  <text x="590" y="391" font-family="Inter, Arial, sans-serif" font-size="16" fill="#68738a">demo-ingest-key - active - last used 2 minutes ago</text>

  <rect x="535" y="505" width="755" height="245" rx="12" fill="#f8fafc" stroke="#d8deea"/>
  <text x="565" y="555" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Alert channels</text>
  <text x="565" y="607" font-family="Inter, Arial, sans-serif" font-size="17" fill="#475569">Webhook URLs and provider tokens are redacted from UI, logs, and AI context.</text>
  <rect x="565" y="640" width="680" height="58" rx="8" fill="#ffffff" stroke="#d8deea"/>
  <text x="590" y="676" font-family="Inter, Arial, sans-serif" font-size="16" fill="#68738a">Ops channel - enabled - secret stored outside Git</text>
</svg>
