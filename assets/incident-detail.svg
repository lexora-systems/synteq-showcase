<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Synteq incident detail mockup</title>
  <desc id="desc">A sanitized product screenshot mockup showing an incident and deterministic guidance.</desc>
  <rect width="1440" height="900" fill="#eef2f7"/>
  <rect x="50" y="50" width="1340" height="800" rx="18" fill="#ffffff" stroke="#d8deea"/>
  <text x="92" y="124" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#172033">Incident: Onboarding failures increased</text>
  <text x="92" y="162" font-family="Inter, Arial, sans-serif" font-size="18" fill="#68738a">Synthetic incident view for public showcase</text>

  <rect x="92" y="210" width="390" height="160" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="122" y="260" font-family="Inter, Arial, sans-serif" font-size="18" fill="#9a3412">Severity</text>
  <text x="122" y="320" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="700" fill="#c2410c">High</text>

  <rect x="525" y="210" width="390" height="160" rx="12" fill="#f8fafc" stroke="#d8deea"/>
  <text x="555" y="260" font-family="Inter, Arial, sans-serif" font-size="18" fill="#68738a">Failure count</text>
  <text x="555" y="320" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="700" fill="#172033">8</text>

  <rect x="958" y="210" width="332" height="160" rx="12" fill="#f8fafc" stroke="#d8deea"/>
  <text x="988" y="260" font-family="Inter, Arial, sans-serif" font-size="18" fill="#68738a">Success rate</text>
  <text x="988" y="320" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="700" fill="#172033">72%</text>

  <rect x="92" y="430" width="570" height="320" rx="12" fill="#f8fafc" stroke="#d8deea"/>
  <text x="122" y="480" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Timeline</text>
  <circle cx="135" cy="540" r="7" fill="#4c7df0"/>
  <text x="160" y="546" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">10:00 - First failed execution received</text>
  <circle cx="135" cy="600" r="7" fill="#4c7df0"/>
  <text x="160" y="606" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">10:03 - Incident opened from grouped failures</text>
  <circle cx="135" cy="660" r="7" fill="#4c7df0"/>
  <text x="160" y="666" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">10:08 - Reliability evidence updated</text>

  <rect x="705" y="430" width="585" height="320" rx="12" fill="#f8fafc" stroke="#d8deea"/>
  <text x="735" y="480" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Operational guidance</text>
  <text x="735" y="535" font-family="Inter, Arial, sans-serif" font-size="17" fill="#475569">Summary: CRM update failures are concentrated in the onboarding workflow.</text>
  <text x="735" y="585" font-family="Inter, Arial, sans-serif" font-size="17" fill="#475569">Evidence: failures share an external dependency category.</text>
  <text x="735" y="635" font-family="Inter, Arial, sans-serif" font-size="17" fill="#475569">Next step: inspect provider status and monitor for recovery.</text>
</svg>
